# Store screenshots: browse production signed out and capture the key screens.
# iOS has no "back" in Maestro, so each screen starts from a fresh launch
# (state is kept, so the welcome screen only shows once).
appId: com.kushicorp.kushi
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Start exploring"
    timeout: 180000
# The notification permission alert can appear a moment after launch; dismiss it.
- extendedWaitUntil:
    visible: "Allow"
    timeout: 8000
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: shots/01-welcome
- tapOn: "Start exploring"
- extendedWaitUntil:
    visible:
      id: "search"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: shots/02-explore

# Map of homes.
- tapOn:
    text: "Map"
    optional: true
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: shots/03-map

# Filters.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "search"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: "Filters"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: shots/04-filters

# A listing, opened by its title, and its sections.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "search"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ".*6 Units of 3-Bedroom.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: ".*6 Units of 3-Bedroom.*"
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: shots/05-listing
- scroll
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: shots/06-listing-2
- scroll
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: shots/07-listing-3
- scroll
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: shots/08-listing-4
- scroll
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: shots/09-listing-5

# Photo gallery from the listing's hero photo.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "search"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ".*6 Units of 3-Bedroom.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: ".*6 Units of 3-Bedroom.*"
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    point: "50%,22%"
    optional: true
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: shots/10-gallery
