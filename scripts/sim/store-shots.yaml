# Store screenshots: browse production signed out and capture the key screens.
# Each screenshot lands next to the run's working directory as shots/NN-name.png.
appId: com.kushicorp.kushi
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Start exploring"
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: shots/01-welcome
- tapOn: "Start exploring"
- extendedWaitUntil:
    visible:
      id: "search"
    timeout: 90000
# Let listing photos arrive from production.
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: shots/02-explore
- scroll
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: shots/03-explore-scrolled
- swipe:
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 4000
# Open the search sheet.
- tapOn:
    id: "search"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: shots/04-search
- back
- waitForAnimationToEnd:
    timeout: 4000
# Open the first listing (the first card sits around the middle of the screen).
- tapOn:
    point: "50%,55%"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: shots/05-listing
- scroll
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: shots/06-listing-2
- scroll
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: shots/07-listing-3
- scroll
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: shots/08-listing-4
