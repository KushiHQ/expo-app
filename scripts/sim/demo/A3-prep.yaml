appId: com.kushicorp.kushi
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Start exploring"
    timeout: 180000
- tapOn:
    text: "Allow"
    optional: true
- tapOn: "Start exploring"
- extendedWaitUntil:
    visible:
      id: "search"
    timeout: 90000
- tapOn: "For sale"
- waitForAnimationToEnd:
    timeout: 12000
- openLink: "kushi://hostings/caa0a4fd-4bfb-4821-9a4d-30a59d4d3f74"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "listing-cta"
    timeout: 60000
- tapOn:
    point: "20%, 92%"
- extendedWaitUntil:
    visible: "Your stay"
    timeout: 10000
