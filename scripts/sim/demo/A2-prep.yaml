appId: com.kushicorp.kushi
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Start exploring"
    timeout: 180000
- tapOn:
    text: "Allow"
    optional: true
- tapOn: "Start exploring"
- extendedWaitUntil:
    visible:
      id: "search"
    timeout: 90000
- tapOn: "For sale"
- waitForAnimationToEnd:
    timeout: 12000
