appId: com.kushicorp.kushi
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Start exploring"
    timeout: 180000
- tapOn:
    text: "Allow"
    optional: true
- tapOn: "Start exploring"
- extendedWaitUntil:
    visible:
      id: "search"
    timeout: 90000
- tapOn: "For sale"
- waitForAnimationToEnd:
    timeout: 12000
- openLink: "kushi://hostings/8d7b096d-9bc2-498d-9c06-088e6d1b3107/gallery"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "photo-viewer"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 10000
