# Listing map for CI: no sign-in needed (listings are public). Opens the QA test
# listing (Kushi-managed, has a pin), checks the Location section and Directions,
# taps the map for the full-screen map, then Directions shows the maps chooser.
# Text/label selectors only: Maestro 2.12 on the iOS 18 iPad missed testIDs.
appId: com.kushicorp.kushi
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "welcome-explore"
    timeout: 180000
- takeScreenshot: shots/00-welcome
- tapOn:
    id: "welcome-explore"
- extendedWaitUntil:
    visible:
      id: "location-skip"
    timeout: 30000
- tapOn:
    id: "location-skip"
- waitForAnimationToEnd:
    timeout: 15000
- openLink: "kushi://hostings/e3ab9468-fd8b-4e99-8321-b1aaac05c6d6"
- extendedWaitUntil:
    visible: "Description"
    timeout: 90000
- takeScreenshot: shots/01-listing
- scrollUntilVisible:
    element: "Open full-screen map"
    centerElement: true
    timeout: 40000
- assertVisible: "Location"
- assertVisible: "Directions"
- takeScreenshot: shots/02-listing-location
- tapOn: "Open full-screen map"
- extendedWaitUntil:
    visible: "Centre on the listing"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: shots/03-full-map
- tapOn: "Directions"
- extendedWaitUntil:
    visible: "Apple Maps"
    timeout: 10000
- assertVisible: "Google Maps"
- takeScreenshot: shots/04-directions-choice
- tapOn: "Cancel"
- waitForAnimationToEnd
- takeScreenshot: shots/05-after-cancel
