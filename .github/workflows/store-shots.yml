name: Store screenshots

# Release simulator build against the production API (real listings and photos),
# browsed signed out, captured on the App Store's required sizes:
# iPhone 6.9" (iPhone 16 Pro Max, 1320x2868) and iPad 13" (2064x2752).
# Also captures iPad landscape. Never builds or submits to a store.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/tablet-layouts

jobs:
  shots:
    runs-on: macos-15
    # The production environment only allows protected branches; use the staging
    # build secrets and point the app at the production API (read-only browsing).
    environment: staging
    timeout-minutes: 120
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file (production API)
        run: |
          echo '${{ secrets.ENV_FILE }}' > .env
          grep -vE '^(EXPO_PUBLIC_GRAPHQL_URL|EXPO_PUBLIC_GRAPHQL_SUBSCRIPTION_URL|EXPO_PUBLIC_SHARE_PROPERTY_URL|EXPO_PUBLIC_SHARE_HOST_URL)=' .env > .env.tmp || true
          mv .env.tmp .env
          cat >> .env <<'ENV'
          EXPO_PUBLIC_GRAPHQL_URL=https://housing.api.kushi.ng/graphql
          EXPO_PUBLIC_GRAPHQL_SUBSCRIPTION_URL=wss://housing.api.kushi.ng/ws
          EXPO_PUBLIC_SHARE_PROPERTY_URL=https://housing.kushi.ng/homes
          EXPO_PUBLIC_SHARE_HOST_URL=https://housing.kushi.ng/host/<slug>
          ENV

      - name: Decode Google Services Plist
        run: echo "${{ secrets.GOOGLE_SERVICES_IOS_BASE64 }}" | base64 --decode > GoogleService-Info.plist

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: shots-cocoapods-${{ hashFiles('package-lock.json') }}
          restore-keys: shots-cocoapods-

      - name: Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Build for simulator
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO | tail -40
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Capture
        run: |
          mkdir -p out
          xcrun simctl list devices available | grep -E "iPhone 16 Pro Max|iPad Pro 13" || true
          for DEVICE in "iPhone 16 Pro Max" "iPad Pro 13-inch (M4)"; do
            SLUG=$(echo "$DEVICE" | tr -cd '[:alnum:]' | tr '[:upper:]' '[:lower:]')
            UDID=$(xcrun simctl list devices available -j | jq -r --arg n "$DEVICE" '[.devices[] | .[] | select(.name == $n)][0].udid')
            if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then echo "No simulator named $DEVICE"; continue; fi
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            xcrun simctl location "$UDID" set 6.4541,3.3947
            xcrun simctl install "$UDID" "$APP"
            mkdir -p "out/$SLUG"
            (cd "out/$SLUG" && maestro --device "$UDID" test ../../scripts/sim/store-shots.yaml --format junit --output report.xml) || echo "FAILED $DEVICE" >> out/failures.txt
            (cd "out/$SLUG" && maestro --device "$UDID" hierarchy > hierarchy-last.json 2>/dev/null) || true
            # Maestro writes screenshots next to the flow file; keep each device's set.
            mv scripts/sim/shots "out/$SLUG/shots" 2>/dev/null || true
            # iPad: a landscape pass (Maestro setOrientation) for the two-column layouts.
            case "$DEVICE" in iPad*)
              mkdir -p "out/$SLUG-landscape"
              (cd "out/$SLUG-landscape" && maestro --device "$UDID" test ../../scripts/sim/store-shots-landscape.yaml --format junit --output report.xml) || echo "FAILED $DEVICE landscape" >> out/failures.txt
              mv scripts/sim/shots-landscape "out/$SLUG-landscape/shots" 2>/dev/null || true
              ;;
            esac
            cp -R ~/.maestro/tests "out/$SLUG/maestro" 2>/dev/null || true
            rm -rf ~/.maestro/tests
            xcrun simctl shutdown "$UDID" || true
          done
          find out -name '*.png' | sort

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-shots
          path: out
          retention-days: 14
