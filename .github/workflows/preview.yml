name: Web preview (screenshots)

# Builds the app for web against the Render test backend and screenshots key
# screens at phone size — a fast visual check without a device build.
on:
  workflow_dispatch:
  push:
    branches:
      - redesign
    paths-ignore:
      - '.github/workflows/android-*'
      - '.github/workflows/ios-*'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        id: tsc
        continue-on-error: true
        run: npx tsc --noEmit -p . 2>&1 | tee tsc.txt; exit ${PIPESTATUS[0]}
      - name: Preview env (test backend, public values only)
        run: |
          cat > .env <<'ENV'
          EXPO_PUBLIC_GRAPHQL_URL=https://kushi-housing-api.onrender.com/graphql
          EXPO_PUBLIC_GRAPHQL_SUBSCRIPTION_URL=wss://kushi-housing-api.onrender.com/ws
          EXPO_PUBLIC_SHARE_PROPERTY_URL=https://kushi-housing-web.onrender.com/homes
          EXPO_PUBLIC_SHARE_HOST_URL=https://kushi-housing-web.onrender.com/hosts
          EXPO_PUBLIC_DAILY_DOMAIN=kushicorp.daily.co
          ENV
      - name: Export web
        env:
          WEB_PREVIEW: '1'
        run: npx expo export --platform web --output-dir dist 2>&1 | tail -40
      - name: Install Playwright
        run: npm i --no-save playwright@1.48.2 serve@14.2.4 && npx playwright install --with-deps chromium
      - name: Screenshot
        env:
          PREVIEW_EMAIL: ${{ secrets.PREVIEW_EMAIL }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
        run: |
          npx serve dist -s -l 8081 > /dev/null 2>&1 &
          sleep 3
          node scripts/preview/shoot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview
          path: |
            preview-shots
            tsc.txt
          retention-days: 7
