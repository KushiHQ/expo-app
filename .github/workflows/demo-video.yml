name: Housing demo footage (signed out)

# Release simulator build against the production API (real listings and photos),
# browsed signed out, captured on the App Store's required sizes:
# iPhone 6.9" (iPhone 16 Pro Max, 1320x2868) and iPad 13" (2064x2752).
# Signed-out production demo capture only. Never builds or submits to a store.
on:
  workflow_dispatch:
  push:
    branches:
      - demo-video

jobs:
  shots:
    runs-on: macos-15
    # The production environment only allows protected branches; use the staging
    # build secrets and point the app at the production API (read-only browsing).
    environment: staging
    timeout-minutes: 90
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file (production API)
        run: |
          echo '${{ secrets.ENV_FILE }}' > .env
          grep -vE '^(EXPO_PUBLIC_GRAPHQL_URL|EXPO_PUBLIC_GRAPHQL_SUBSCRIPTION_URL|EXPO_PUBLIC_SHARE_PROPERTY_URL|EXPO_PUBLIC_SHARE_HOST_URL)=' .env > .env.tmp || true
          mv .env.tmp .env
          cat >> .env <<'ENV'
          EXPO_PUBLIC_GRAPHQL_URL=https://housing.api.kushi.ng/graphql
          EXPO_PUBLIC_GRAPHQL_SUBSCRIPTION_URL=wss://housing.api.kushi.ng/ws
          EXPO_PUBLIC_SHARE_PROPERTY_URL=https://housing.kushi.ng/homes
          EXPO_PUBLIC_SHARE_HOST_URL=https://housing.kushi.ng/host/<slug>
          ENV

      - name: Decode Google Services Plist
        run: echo "${{ secrets.GOOGLE_SERVICES_IOS_BASE64 }}" | base64 --decode > GoogleService-Info.plist

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: shots-cocoapods-${{ hashFiles('package-lock.json') }}
          restore-keys: shots-cocoapods-

      - name: Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Cache simulator build
        uses: actions/cache@v4
        with:
          path: build
          key: demo-simulator-${{ hashFiles('package-lock.json', 'app.config.js') }}

      - name: Build for simulator
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO | tail -40
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Capture signed-out demo clips
        run: |
          set -euo pipefail
          mkdir -p out/app-ios out/app-stills out/reports
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name == "iPhone 16 Pro")][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | test("^iPhone.*Pro"))][0].udid')
          fi
          test "$UDID" != "null"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl location "$UDID" set 9.0765,7.3986
          xcrun simctl install "$UDID" "$APP"
          echo "$UDID" > out/device.txt
          REC=""
          stop_recording() {
            if [ -n "$REC" ]; then kill -INT "$REC" 2>/dev/null || true; wait "$REC" || true; REC=""; fi
          }
          trap stop_recording EXIT INT TERM
          for NAME in A1 A2 A3 A4 A5 A6; do
            if ! maestro --device "$UDID" test "scripts/sim/demo/$NAME-prep.yaml" --format junit --output "out/reports/$NAME-prep.xml"; then
              echo "$NAME preparation failed; no clip accepted" >> out/failures.txt
              continue
            fi
            sleep 3
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "out/app-ios/$NAME.mp4" &
            REC=$!
            sleep 2
            if maestro --device "$UDID" test "scripts/sim/demo/$NAME.yaml" --format junit --output "out/reports/$NAME.xml"; then
              echo "$NAME flow completed; pending visual review" >> out/status.txt
            else
              echo "$NAME flow failed; clip excluded until reviewed" >> out/failures.txt
            fi
            sleep 4
            stop_recording
            xcrun simctl io "$UDID" screenshot "out/app-stills/$NAME-final.png"
          done
          cp -R scripts/sim/demo/shots out/app-stills/flow-shots 2>/dev/null || true
          xcrun simctl shutdown "$UDID" || true

      - name: Upload footage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: housing-demo-footage
          path: out
          retention-days: 30
