name: Build and Submit Android
on:
  workflow_dispatch:
  push:
    branches:
      - main

# Staging and production upload to the same Play app; two uploads at once
# delete each other's edit ("This Edit has been deleted"). Run one at a time.
concurrency:
  group: play-store-upload
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android]')
    runs-on: ubuntu-latest
    environment: production
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships ~14GB free — not enough for a local Android
      # app-bundle build (it fails with "No space left on device"). Reclaim
      # the large pre-installed toolchains we don't use, keeping the Android
      # SDK, Java, Node and Docker engine intact.
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/share/powershell 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "Disk after cleanup:"; df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create .env file
        run: echo '${{ secrets.ENV_FILE }}' > .env

      - name: Point at the kushi.ng production API
        run: |
          grep -vE '^(EXPO_PUBLIC_GRAPHQL_URL|EXPO_PUBLIC_GRAPHQL_SUBSCRIPTION_URL|EXPO_PUBLIC_SHARE_PROPERTY_URL|EXPO_PUBLIC_SHARE_HOST_URL)=' .env > .env.tmp || true
          mv .env.tmp .env
          cat >> .env <<'ENV'
          EXPO_PUBLIC_GRAPHQL_URL=https://housing.api.kushi.ng/graphql
          EXPO_PUBLIC_GRAPHQL_SUBSCRIPTION_URL=wss://housing.api.kushi.ng/ws
          EXPO_PUBLIC_SHARE_PROPERTY_URL=https://housing.kushi.ng/homes
          EXPO_PUBLIC_SHARE_HOST_URL=https://housing.kushi.ng/host/<slug>
          ENV

      - name: Decode Google Services JSON
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > google-services.json

      - name: Cache Metro bundler
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/metro
            ${{ github.workspace }}/.expo
          key: metro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: metro-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # A normal build takes ~50 min. Twice (1.4.3) Gradle failed at the final
      # bundle packaging/signing step without printing why and then hung until
      # the 6 h job limit, so cap the step and keep evidence for the failure dump.
      - name: Build Android (local)
        timeout-minutes: 90
        run: |
          set -o pipefail
          ( while true; do { date -u +%T; free -m | sed -n 2,3p; ps -eo rss,comm --sort=-rss | sed -n 2,6p; } >> /tmp/mem.log; sleep 60; done ) &
          eas build --platform android --profile production --local --non-interactive 2>&1 | tee /tmp/eas-output.txt || true
          AAB_PATH=$(grep -oE '[^[:space:]]+\.aab' /tmp/eas-output.txt | tail -1)
          if [ -z "$AAB_PATH" ] || [ ! -f "$AAB_PATH" ]; then
            echo "❌ Could not locate built .aab file"
            exit 1
          fi
          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"
          echo "✅ Built AAB: $AAB_PATH"

      - name: Gradle diagnostics
        if: failure() || cancelled()
        run: |
          echo "── memory over time"; tail -60 /tmp/mem.log || true
          echo "── kernel OOM kills"; sudo dmesg -T 2>/dev/null | grep -iE "out of memory|killed process|oom" | tail -20 || true
          echo "── heap dumps / JVM crash logs"; sudo find / -xdev \( -name 'java_pid*.hprof' -o -name 'hs_err_pid*.log' \) -printf '%p %s\n' 2>/dev/null | head || true
          for f in $(sudo find / -xdev -name 'hs_err_pid*.log' 2>/dev/null | head -2); do echo "── $f"; sudo head -40 "$f"; done
          echo "── Gradle daemon log"; for f in $(ls -t ~/.gradle/daemon/*/daemon-*.out.log 2>/dev/null | head -2); do echo "── $f"; grep -nE -B2 -A40 "FAILED|Exception|Error" "$f" | tail -150; done
          echo "── processes"; ps -eo pid,rss,etime,comm --sort=-rss | head -15

      # Keep the build so a failed store upload can be retried without rebuilding.
      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ${{ env.AAB_PATH }}
          retention-days: 7

      - name: Extract build number
        run: |
          BUILD_NUMBER=$(grep -oE 'versionCode from [0-9]+ to ([0-9]+)' /tmp/eas-output.txt | grep -oE '[0-9]+$' | tail -1)
          echo "BUILD_NUMBER=${BUILD_NUMBER:-unknown}" >> "$GITHUB_ENV"

      - name: Decode Google Play key
        run: echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}" | base64 --decode > google-play-key.json

      - name: Submit to Play Store
        run: eas submit --platform android --profile production --non-interactive --path "$AAB_PATH"

      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="✅ Kushi Android build submitted to Play Store"
            COLOR=3581519
          else
            TITLE="❌ Kushi Android build failed"
            COLOR=13369344
          fi
          jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT_MSG" \
            --arg actor "$ACTOR" \
            --arg build "$BUILD_NUMBER" \
            --arg run_url "$RUN_URL" \
            '{embeds:[{title:$title,color:$color,fields:[
              {name:"Branch",value:$branch,inline:true},
              {name:"Commit",value:$commit,inline:true},
              {name:"Actor",value:$actor,inline:true},
              {name:"Build",value:$build,inline:true},
              {name:"Run",value:"[\("View logs")](\($run_url))",inline:true}
            ]}]}' \
          | curl -sSf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
